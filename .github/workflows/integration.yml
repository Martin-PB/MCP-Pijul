name: integration

# Path-gated + dispatch: installs pijul (expensive) and runs the repository
# tests for real. Following the economy principle, the install is cached and
# the job only runs when the code under test actually changed.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump to refresh the cache when targeting a newer pijul.
  PIJUL_VERSION: "~1.0.0-beta"

jobs:
  repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache pijul install
        id: pijul-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/pijul
          key: pijul-${{ env.PIJUL_VERSION }}-${{ runner.os }}
      - name: Install pijul
        if: steps.pijul-cache.outputs.cache-hit != 'true'
        run: cargo install --version "${PIJUL_VERSION}" pijul
      - name: Repository tests against generated pijul repos
        env:
          PATH: "/home/runner/.cargo/bin:${{ github.workspace }}/target/debug:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        run: cargo test --locked --test repositories
