[package]
name = "mcp-server-pijul"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MCP server exposing Pijul version control operations to AI agents"
repository = "https://github.com/Martin-PB/MCP-Pijul"
keywords = ["mcp", "pijul", "vcs", "ai", "agent"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
